<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prenotazioni Gens</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="apple-touch-icon" href="logo.png">
  <meta name="theme-color" content="#DCD6CA">
  <style>
    body { font-family: sans-serif; margin: 0; padding: 1rem; background: #DCD6CA; }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; }
    .nav { display: flex; justify-content: space-between; margin-bottom: 1rem; }
    .nav button { padding: 0.5rem 1rem; font-size: 1rem; }
    #content { min-height: 200px; }
    .list-section { background: white; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .list-section h2 { margin-top: 0; margin-bottom: 0.5rem; }
    ul { list-style: none; padding-left: 0; margin: 0; }
    li { padding: 0.3rem 0; }
    .name { color: #000; cursor: pointer; text-decoration: none; }
    .name:hover { text-decoration: underline; }
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 1.5rem; border-radius: 8px; max-width: 400px; width: 90%; position: relative; }
    .modal-close { position: absolute; top: 0.3rem; right: 0.5rem; font-size: 1.5rem; font-weight: bold; cursor: pointer; }
    @media (max-width: 600px) { h1 { font-size: 1.2rem; } .nav button { font-size: 0.9rem; padding: 0.4rem 0.8rem; } }
  </style>
</head>
<body>
  <h1>Prenotazioni del <span id="current-date"></span></h1>
  <div class="nav">
    <button id="prev-day">< Giorno precedente</button>
    <button id="next-day">Giorno successivo ></button>
  </div>
  <div id="content"></div>
  <div class="modal" id="modal">
    <div class="modal-content">
      <span class="modal-close" id="modal-close">&times;</span>
      <h3 id="modal-title"></h3>
      <p><strong>Nome e Cognome:</strong> <span id="modal-nome"></span></p>
      <p><strong>Anni:</strong> <span id="modal-anni"></span></p>
      <p><strong>Telefono:</strong> <span id="modal-tel"></span></p>
      <p><strong>Note:</strong> <span id="modal-note"></span></p>
    </div>
  </div>
<script>
const allData = {
};
const allExtraEvents = {
};
function renderDay(dateStr) {
  const data = allData[dateStr] || [];
  const countPresente = data.filter(p => p.presente).length;
  const countGoblins = data.filter(p => p.goblins).length;
  const countPranzo = data.filter(p => p.pranzo).length;
  const countLecciona = data.filter(p => p.lecciona && !p.versiliana && !p.goblins).length;
  const countVersiliana = data.filter(p => p.versiliana && !p.goblins).length;
  document.getElementById('current-date').textContent = dateStr + ' ' + getDayName(dateStr);
  document.getElementById('content').innerHTML = '' +
    '<div class="list-section"><h2>Mattina Lecciona ('+countPresente+')</h2><ul id="list-presente"></ul></div>' +
    '<div class="list-section"><h2>Rifugio dei Folletti ('+countGoblins+')</h2><ul id="list-goblins"></ul></div>' +
    '<div class="list-section"><h2>Pranzo ('+countPranzo+')</h2><ul id="list-pranzo"></ul></div>' +
    '<div class="list-section"><h2>Pomeriggio Lecciona ('+countLecciona+')</h2><ul id="list-lecciona"></ul></div>' +
    '<div class="list-section"><h2>Pomeriggio Versiliana ('+countVersiliana+')</h2><ul id="list-versiliana"></ul></div>';
  const listPresente = document.getElementById('list-presente');
  const listGoblins = document.getElementById('list-goblins');
  const listPranzo = document.getElementById('list-pranzo');
  const listLecciona = document.getElementById('list-lecciona');
  const listVersiliana = document.getElementById('list-versiliana');
  function createListItem(p) {
    const li = document.createElement('li');
    const span = document.createElement('span');
    span.className = 'name';
    span.textContent = p.nick;
    span.onclick = () => showModal(p);
    li.appendChild(span);
    return li;
  }
  data.forEach(p => {
    if (p.presente) listPresente.appendChild(createListItem(p));
    if (p.goblins) listGoblins.appendChild(createListItem(p));
    if (p.pranzo) listPranzo.appendChild(createListItem(p));
    if (p.lecciona && !p.versiliana && !p.goblins) listLecciona.appendChild(createListItem(p));
    if (p.versiliana && !p.goblins) listVersiliana.appendChild(createListItem(p));
  });
  renderExtraEvents(dateStr);
}
function showModal(p) {
  document.getElementById('modal-title').textContent = p.nick;
  document.getElementById('modal-nome').textContent = p.nome;
  document.getElementById('modal-anni').textContent = p.anni;
  document.getElementById('modal-tel').textContent = p.tel;
  document.getElementById('modal-note').textContent = p.note;
  document.getElementById('modal').style.display = 'flex';
}
document.getElementById('modal-close').onclick = () => { document.getElementById('modal').style.display = 'none'; };
function isWeekend(dateStr) {
  const [d, m, y] = dateStr.split('/').map(Number);
  const dt = new Date(y, m-1, d);
  return dt.getDay() === 0 || dt.getDay() === 6;
}
function showClosed() {
  document.getElementById('content').innerHTML = '<h2>Accademia Chiusa</h2>'; 
}
function getToday() {
  const t = new Date();
  return ('0'+t.getDate()).slice(-2)+'/'+('0'+(t.getMonth()+1)).slice(-2)+'/'+t.getFullYear();
}
function getDayName(dateStr) {
  const [d, m, y] = dateStr.split('/').map(Number); 
  const dt = new Date(y, m - 1, d); 
  return dt.toLocaleDateString('it-IT', { weekday: 'long' }); 
}
function shiftDate(dateStr, days) {
  const [d, m, y] = dateStr.split('/').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate() + days);
  return ('0'+dt.getDate()).slice(-2)+'/'+('0'+(dt.getMonth()+1)).slice(-2)+'/'+dt.getFullYear();
}
const dates = Object.keys(allData).sort((a,b) => {
  const [da, ma, ya] = a.split('/').map(Number);
  const [db, mb, yb] = b.split('/').map(Number);
  return new Date(ya, ma-1, da) - new Date(yb, mb-1, db);
});
function getQueryParam(name) {
  const params = new URLSearchParams(window.location.search);
  return params.get(name);
}
let today = getToday();
let paramDate = getQueryParam('date');
let shownDate = paramDate ? paramDate : today;
let hasTodayData = allData[shownDate] && allData[shownDate].length > 0;
let currentIndex = dates.indexOf(shownDate);
if (currentIndex === -1) currentIndex = dates.length - 1;
function showDate(dateStr) {
  shownDate = dateStr;
  currentIndex = dates.indexOf(dateStr);
  if (allData[dateStr] && allData[dateStr].length > 0) {
    renderDay(dateStr);
  } else {
    renderDay(dateStr);
  }
}
function renderExtraEvents(dateStr) {
  const events = allExtraEvents[dateStr] || [];
  if (events.length === 0) return;
  const grouped = {};
  events.forEach(e => {
    const key = e.activity + ' ore ' + e.time + (e.confirmed ? ' (Confermato: Si)' : ' (Confermato: No)');
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(e);
  });
  const container = document.createElement('div');
  container.className = 'list-section';
  const h2 = document.createElement('h2'); h2.textContent = 'Eventi Extra'; container.appendChild(h2);
  for (const [eventKey, participants] of Object.entries(grouped)) {
    const h3 = document.createElement('h3'); h3.textContent = eventKey; container.appendChild(h3);
    const ul = document.createElement('ul');
    participants.forEach(p => {
      const li = document.createElement('li');
      const span = document.createElement('span');
      span.className = 'name';
      span.textContent = p.nick;
      span.onclick = () => showModal(p);
      li.appendChild(span);
      ul.appendChild(li);
    });
    container.appendChild(ul);
  }
  document.getElementById('content').appendChild(container);
}
showDate(shownDate);
document.getElementById('prev-day').onclick = () => {
  showDate(shiftDate(shownDate, -1));
};
document.getElementById('next-day').onclick = () => {
  showDate(shiftDate(shownDate, 1));
};
</script>
</body></html>
